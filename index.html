<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ik wil beter beveiligd worden - Digitale Defensie</title>
<meta name="description" content="Ontdek je digitale veiligheid: diensten met vaste prijs, gratis quick wins en een eerlijk rapport binnen 48 uur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#070B1F;color:#E8ECFF;font-family:'Manrope',system-ui,sans-serif}
a{color:#5CE1FF}a:hover{color:#B5F1FF}
[hidden]{display:none !important}
button{font:inherit}
 
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes stars{from{background-position:0 0}to{background-position:0 -600px}}
@keyframes starsX{from{background-position:0 0}to{background-position:-600px 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes hintBlink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes glitchA{0%,88%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}89%{transform:translate(-3px,1px);clip-path:inset(12% 0 55% 0)}92%{transform:translate(2px,-1px);clip-path:inset(60% 0 10% 0)}95%{transform:translate(-1px,0);clip-path:inset(35% 0 40% 0)}}
@keyframes glitchB{0%,85%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}86%{transform:translate(3px,-1px);clip-path:inset(68% 0 6% 0)}90%{transform:translate(-2px,1px);clip-path:inset(22% 0 58% 0)}93%{transform:translate(1px,1px);clip-path:inset(46% 0 30% 0)}}
@keyframes jitter{0%,88%,100%{transform:none}89%{transform:skewX(-6deg)}91%{transform:skewX(4deg)}93%{transform:none}}
@keyframes keyTurn{0%{transform:rotate(0)}100%{transform:rotate(90deg)}}
@keyframes shackleOpen{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(4px) rotate(0)}55%{transform:translateY(-34px) rotate(0)}75%{transform:translateY(-34px) rotate(-34deg)}88%{transform:translateY(-34px) rotate(-28deg)}100%{transform:translateY(-34px) rotate(-30deg)}}
@keyframes bodyFlash{0%,40%{fill:#0C1230}55%{fill:#1C3A7A}100%{fill:#0C1230}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes particle{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
@keyframes zoomThrough{0%,55%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(9);opacity:0;filter:blur(6px)}}
@keyframes textAway{to{opacity:0;transform:translateY(30px);letter-spacing:.2em}}
@keyframes reveal{from{clip-path:circle(0% at 50% 44%)}to{clip-path:circle(150% at 50% 44%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tapPulse{0%{transform:translate(-50%,-50%) scale(.72);opacity:.95}70%{opacity:0}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
@keyframes blipIn{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes blipOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(.2)}}
@keyframes blipPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blipRing{0%{transform:translate(-50%,-50%) scale(.5);opacity:.7}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
 
.app{position:relative;min-height:100vh;min-height:100dvh;background:radial-gradient(1100px 700px at 50% 40%,#13205A 0%,#070B1F 62%);overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 140px 220px,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 300px 80px,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 420px 400px,rgba(255,255,255,.3),transparent);background-size:480px 600px;animation:stars 70s linear infinite}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
 
/* ================= SLOT-SCHERM ================= */
.lockLayer{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{max-width:1240px;width:100%;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:10px;color:#E8ECFF;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px}
.logo:hover{color:#E8ECFF}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 48px;position:relative}
.radar{position:absolute;left:50%;top:44%;width:min(820px,150vw);aspect-ratio:1/1;transform:translate(-50%,-50%);pointer-events:none}
.radar .r{position:absolute;border-radius:50%}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(92,225,255,0) 0deg,rgba(92,225,255,0) 300deg,rgba(92,225,255,.28) 360deg);animation:spin 6s linear infinite}
.ringA{animation:spin 26s linear infinite}
.ringB{animation:spinRev 40s linear infinite}
.blips{position:absolute;inset:0}
.blip{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 10px #FF4D5E,0 0 2px #fff;animation:blipIn .4s ease-out both,blipPulse 1.5s ease-in-out .4s infinite}
.blip::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:1.5px solid #FF4D5E;animation:blipRing 1.5s ease-out .4s infinite}
.blip.out{animation:blipOut .35s ease-in both !important}
.blip.out::after{animation:none;opacity:0}
.unlock{background:transparent;border:0;padding:0;margin:0;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:30px;position:relative}
.unlock:focus-visible{outline:3px solid #5CE1FF;outline-offset:12px;border-radius:24px}
.lockwrap{position:relative;animation:float 5s ease-in-out infinite}
.lockSvg{width:230px;height:276px;overflow:visible;filter:drop-shadow(0 0 40px rgba(92,225,255,.35));position:relative;z-index:2}
.unlock:hover .lockSvg{animation:wiggle .6s ease-in-out}
.unlock:hover .lockLabel{text-shadow:0 0 30px rgba(92,225,255,.55)}
.shackle{transform-box:view-box;transform-origin:150px 112px}
.keyhole{transform-box:view-box;transform-origin:100px 168px}
.flowline{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
.glow{animation:breathe 3s ease-in-out infinite}
.tapring{position:absolute;left:50%;top:48%;width:190px;height:190px;border-radius:50%;border:2px solid #5CE1FF;transform:translate(-50%,-50%);opacity:0;pointer-events:none;animation:tapPulse 2.2s ease-out infinite;z-index:1}
.tapring2{animation-delay:1.1s}
.unlock:hover .tapring{animation-play-state:paused;opacity:0}
.ctaText{display:flex;flex-direction:column;align-items:center;gap:18px}
.lockLabel{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,4.6vw,64px);line-height:1.08;letter-spacing:-.02em;text-align:center;max-width:900px;transition:text-shadow .3s ease}
.hint{display:inline-flex;align-items:center;gap:9px;margin:0;font-size:15px;font-weight:600;letter-spacing:.12em;color:#5CE1FF;animation:hintBlink 2.4s ease-in-out infinite;transition:opacity .3s}
.hint svg{width:18px;height:18px;stroke:#5CE1FF;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.glitch{position:relative;display:inline-block;color:#5CE1FF;animation:jitter 3.4s infinite}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:#9C8CFF;animation:glitchA 3.4s infinite}
.glitch::after{color:#FFFFFF;animation:glitchB 4.1s infinite;opacity:.8}
.opening .shackle{animation:shackleOpen 1s cubic-bezier(.5,0,.2,1.3) .25s both}
.opening .keyhole{animation:keyTurn .35s ease-in-out both}
.opening .lockBody{animation:bodyFlash 1s ease-out .3s both}
.opening .lockwrap{animation:zoomThrough 1.9s cubic-bezier(.7,0,.3,1) both}
.opening .lockLabel{animation:textAway .5s ease-in .35s both}
.opening .hint{opacity:0}
.opening .tapring{opacity:0;animation:none}
.opening .unlock{cursor:default}
.burst{position:absolute;left:50%;top:44%;width:240px;height:240px;border-radius:50%;border:2px solid #5CE1FF;pointer-events:none;animation:burst 1.1s cubic-bezier(.2,.7,.3,1) both}
.part{position:absolute;left:50%;top:44%;width:8px;height:8px;border-radius:50%;background:#5CE1FF;box-shadow:0 0 12px currentColor;pointer-events:none;animation:particle 1s cubic-bezier(.1,.7,.3,1) .45s both}
 
/* ================= PLANEET-HOP ================= */
@keyframes streak{from{background-position:0 0}to{background-position:-1200px 0}}
@keyframes pglow{0%,100%{box-shadow:0 0 60px -10px var(--bc)}50%{box-shadow:0 0 110px 0 var(--bc)}}
.hop{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0B1238 0%,#070B1F 70%);animation:reveal 1s cubic-bezier(.7,0,.2,1) both}
.hop .stars{animation:starsX 90s linear infinite}
.streaks{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background-image:repeating-linear-gradient(0deg,transparent 0 37px,rgba(181,241,255,.35) 37px 38px,transparent 38px 91px),repeating-linear-gradient(0deg,transparent 0 63px,rgba(156,140,255,.25) 63px 64px,transparent 64px 140px);background-size:300px 100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.warping .streaks{opacity:1;animation:streak .5s linear infinite}
.hopTop{position:absolute;left:0;right:0;top:0;z-index:6;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(7,11,31,.85),transparent)}
.hopTop .r{display:flex;align-items:center;gap:14px}
.stopNum{font-size:12px;letter-spacing:.14em;font-weight:700;color:#8E98C8}
.lockBtn{cursor:pointer;background:transparent;color:#AEB7E0;border:1px solid #2A3570;border-radius:999px;padding:9px 16px;min-height:44px;font-size:13px}
.lockBtn:hover{color:#E8ECFF;border-color:#5CE1FF}
 
.space{position:absolute;left:0;right:0;top:0;bottom:0}
.orbitLine{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #22306A}
.track{position:absolute;left:24%;top:50%;transition:transform 1.1s cubic-bezier(.7,0,.2,1),left 1.1s cubic-bezier(.7,0,.2,1)}
.stopEl{position:absolute;transform:translate(-50%,-50%) scale(var(--s,0.8));transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity .8s,filter .8s}
.stopEl.off{opacity:.45;filter:blur(1.5px)}
.planet{--bc:#5CE1FF;position:relative;border-radius:50%;border:2px solid var(--bc);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc) 40%,#0C1230),#0A0F2A 72%);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.planet svg{stroke:var(--bc);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.planet:focus-visible{outline:3px solid var(--bc);outline-offset:6px}
.stopEl.on .planet{animation:pglow 3s ease-in-out infinite}
.ringE{position:absolute;left:50%;top:50%;width:170%;height:38%;transform:translate(-50%,-50%) rotate(-14deg);border-radius:50%;border:2px solid var(--bc);opacity:.45;pointer-events:none}
.pname{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);margin:0;white-space:nowrap;font-size:14px;font-weight:700}
.moonLink{position:absolute;height:0;border-top:1.5px dashed rgba(181,241,255,.55);transform-origin:0 0}
 
.card{position:absolute;z-index:5;right:max(24px,calc(50% - 680px));top:76px;bottom:116px;width:min(600px,calc(100% - 48px));overflow-y:auto;background:rgba(7,11,31,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #1F2A60;border-radius:26px;padding:30px;scrollbar-width:thin;scrollbar-color:#2A3570 transparent}
.card:focus{outline:none}
.kicker{margin:0;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--sc,#5CE1FF)}
.cTitle{margin:0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(26px,2.6vw,36px);line-height:1.08}
.cText{margin:0;font-size:15.5px;line-height:1.65;color:#C3CAEB}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-block;background:var(--sc,#5CE1FF);color:#070B1F;font-weight:700;padding:14px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{color:#070B1F;transform:translateY(-2px);box-shadow:0 12px 40px -8px var(--sc,#5CE1FF)}
.ghost{cursor:pointer;background:transparent;color:#AEB7E0;border:1px solid #2A3570;border-radius:999px;padding:10px 18px;min-height:44px;transition:color .2s,border-color .2s}
.ghost:hover{color:#E8ECFF;border-color:var(--sc,#5CE1FF)}
.moonBtn{cursor:pointer;background:transparent;color:#B5F1FF;border:1.5px dashed #B5F1FF;border-radius:14px;padding:12px 16px;min-height:48px;font-weight:700;text-align:left}
.moonBtn:hover{background:rgba(181,241,255,.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
 
@keyframes navHello{0%,100%{box-shadow:0 18px 50px -24px rgba(92,225,255,.5),0 0 0 0 rgba(92,225,255,0)}50%{box-shadow:0 18px 50px -24px rgba(92,225,255,.5),0 0 0 8px rgba(92,225,255,.18)}}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.hopNav{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px}
.navbtn{cursor:pointer;width:64px;height:64px;flex:none;border-radius:50%;border:2px solid #3A4A8A;background:rgba(12,18,48,.95);color:#FFFFFF;font-size:24px;font-weight:700;box-shadow:0 12px 30px -14px rgba(92,225,255,.6);transition:border-color .2s,transform .2s,background .2s}
.navbtn:hover{border-color:#5CE1FF;background:#13205A;transform:scale(1.08)}
#nextBtn{background:#5CE1FF;border-color:#5CE1FF;color:#070B1F}
#nextBtn span{display:inline-block;animation:arrowNudge 1.4s ease-in-out infinite}
#nextBtn:hover{background:#B5F1FF}
.navbtn:focus-visible{outline:3px solid #5CE1FF;outline-offset:3px}
.dots{display:flex;gap:4px;overflow-x:auto;max-width:calc(100% - 170px);background:rgba(10,15,42,.94);border:1.5px solid #2A3570;border-radius:22px;padding:6px 8px;scrollbar-width:none;animation:navHello 2.4s ease-in-out 1.2s 3}
.dotbtn{cursor:pointer;background:transparent;border:0;border-radius:16px;padding:8px 14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#AEB7E0;font-size:13.5px;font-weight:700;white-space:nowrap;transition:background .25s,color .25s}
.dotbtn:hover{color:#FFFFFF;background:rgba(255,255,255,.05)}
.dotbtn i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bc);transition:background .3s,transform .3s,box-shadow .3s}
.dotbtn.on{color:#FFFFFF;background:color-mix(in srgb,var(--bc) 16%,transparent)}
.dotbtn.on i{background:var(--bc);transform:scale(1.25);box-shadow:0 0 12px var(--bc)}
.dotbtn:focus-visible{outline:2px solid var(--bc);border-radius:16px}
 
/* Start-kaart: beloftes + keuzes */
.usps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.usps li{border:1px solid #2A3570;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.4;color:#C3CAEB}
.usps b{display:block;font-family:'Unbounded',sans-serif;color:#5CE1FF;font-size:18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:#E8ECFF;background:rgba(12,18,48,.85);border:1.5px solid #2A3570;border-radius:16px;padding:14px 16px;min-height:64px;transition:border-color .2s,transform .2s,background .2s}
.choice:hover{border-color:var(--c);transform:translateX(4px);background:rgba(19,32,90,.9)}
.choice:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.chIc{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center}
.chIc svg{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chSub{font-size:13.5px;color:#AEB7E0}
@media (max-width:480px){.usps{grid-template-columns:1fr}}
 
/* Diensten-planeet met minimaantjes */
.miniOrbit{position:absolute;inset:-22%;border-radius:50%;border:1px dashed rgba(181,241,255,.35);animation:spin 14s linear infinite;pointer-events:none}
.miniOrbit i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;box-shadow:0 0 12px currentColor}
.enterHint{position:absolute;left:50%;top:calc(100% + 40px);transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.14em;font-weight:700;color:#B5F1FF;opacity:0;transition:opacity .4s;animation:hintBlink 2.4s infinite}
.stopEl.on .enterHint{opacity:1}
 
/* Duik-animatie de planeet in */
.stopEl{z-index:1}
.stopEl.on{z-index:3}
.hop .hopTop,.hop .card,.hop .hopNav,.hop .orbitLine{transition:opacity .45s ease}
.hop.diving .hopTop,.hop.diving .card,.hop.diving .hopNav,.hop.diving .orbitLine{opacity:0;pointer-events:none}
.hop.diving .stopEl.off{opacity:0}
.hop.diving .enterHint,.hop.diving .pname{opacity:0 !important;transition:opacity .25s}
.hop.diving .stopEl.on{transition:transform 1.15s cubic-bezier(.6,0,.4,1),filter 1.15s}
.hop.diving .stopEl.on .planet{filter:brightness(1.6)}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--ox,50%) var(--oy,50%),rgba(181,241,255,.55),transparent 45%);opacity:0;z-index:7}
.hop.diving .flash{animation:flashIn 1.2s ease-out both}
@keyframes flashIn{0%{opacity:0}55%{opacity:1}100%{opacity:0}}
@keyframes svcIn{from{clip-path:circle(0px at var(--ox) var(--oy))}to{clip-path:circle(160% at var(--ox) var(--oy))}}
@keyframes svcOut{from{clip-path:circle(160% at var(--ox) var(--oy))}to{clip-path:circle(0px at var(--ox) var(--oy))}}
 
/* ================= DIENSTEN-STELSEL (jouw orbit) ================= */
@keyframes popCore{0%{transform:translate(-50%,-50%) scale(.4) rotate(-40deg);opacity:0}70%{transform:translate(-50%,-50%) scale(1.08) rotate(4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes sPing{0%{transform:translate(-50%,-50%) scale(.9);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@keyframes coreBreathe{0%,100%{box-shadow:0 0 40px -6px var(--sc)}50%{box-shadow:0 0 80px 0 var(--sc)}}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes planetIn{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
@keyframes ringIn{from{opacity:0;transform:scale(.3) rotate(-90deg)}to{opacity:1;transform:none}}
.svcLayer{position:absolute;inset:0;z-index:8;overflow-y:auto;background:radial-gradient(1000px 600px at 30% 30%,#13205A 0%,#070B1F 65%);animation:svcIn 1s cubic-bezier(.7,0,.2,1) both}
.svcLayer.leaving{animation:svcOut .85s cubic-bezier(.6,0,.4,1) both}
.svcInner{position:relative;max-width:1240px;margin:0 auto;padding:22px 24px 56px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.svcTop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.crumbs{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
.crumbs span{color:#4A5590}
.crumbs b{color:#5CE1FF}
.oLayout{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.oLeft{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.oHint{margin:0;font-size:13px;letter-spacing:.14em;color:#AEB7E0;font-weight:700}
.oWrap{--sc:#5CE1FF;position:relative;width:min(100%,560px);aspect-ratio:1/1}
.oWrap .r{position:absolute;border-radius:50%;animation:ringIn 1s .35s cubic-bezier(.2,.8,.2,1) both}
.sOrbit{animation:spin 48s linear infinite}
.sCounter{animation:spinRev 48s linear infinite}
.oTrail{position:absolute;inset:12%;animation:spin 9s linear infinite}
.oTrail span{position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--sc);box-shadow:0 0 16px 4px var(--sc);transition:background .5s,box-shadow .5s}

    lvl.style.transform = 'translateY(' + (232 - (score / 100) * 222 - 6) + 'px)';
    Array.prototype.forEach.call(document.querySelectorAll('#shieldSvg .liquid'), function (p) { p.setAttribute('fill', liquid); });
    document.getElementById('shieldPct').textContent = score + '%';
    var body = document.getElementById('qwBody');
    var done = qw.step >= QS.length;
    if (!done) {
      var q = QS[qw.step];
      var bar = QS.map(function (x, i) { return '<span style="flex:1;height:6px;border-radius:99px;background:' + (qw.answers[i] ? QC[qw.answers[i]] : (i === qw.step ? '#5CE1FF' : '#1A2350')) + '"></span>'; }).join('');
      body.innerHTML =
        '<div class="stack" style="gap:14px">' +
          '<div style="display:flex;gap:6px" aria-hidden="true">' + bar + '</div>' +
          '<p class="kicker rise" style="--sc:#3ECF8E">LAAG ' + (qw.step + 1) + ' VAN 5 · ' + q.label + '</p>' +
          '<h2 class="rise" style="margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:20px;line-height:1.25;animation-delay:.05s">' + q.q + '</h2>' +
          '<div class="row rise" style="animation-delay:.12s">' +
            '<button type="button" class="ans" style="--ac:#3ECF8E" data-a="ja">✓ ' + q.a[0] + '<small>+2 schildkracht</small></button>' +
            '<button type="button" class="ans" style="--ac:#FFC24D" data-a="deels">– ' + q.a[1] + '<small>+1 schildkracht</small></button>' +
            '<button type="button" class="ans" style="--ac:#FF4D5E" data-a="nee">✕ ' + q.a[2] + '<small>gat in je schild</small></button>' +
          '</div>' +
        '</div>';
      Array.prototype.forEach.call(body.querySelectorAll('[data-a]'), function (b) {
        b.addEventListener('click', function () { qw.answers[qw.step] = b.dataset.a; qw.step++; renderShield(); });
      });
    } else {
      var bad = QS.map(function (x, i) { return i; }).filter(function (i) { return qw.answers[i] !== 'ja'; });
      bad.sort(function (x, y) { return (qw.answers[x] === 'nee' ? 0 : 1) - (qw.answers[y] === 'nee' ? 0 : 1); });
      var verdict = score < 40 ? 'SCHILD ZWAK' : (score < 70 ? 'SCHILD HALFVOL' : 'SCHILD STERK');
      body.innerHTML =
        '<div class="stack" style="gap:12px">' +
          '<p class="kicker rise" style="--sc:' + liquid + '">' + verdict + '</p>' +
          '<h2 class="rise" style="margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:20px">' + (bad.length ? 'Jouw quick wins' : 'Sterk schild!') + '</h2>' +
          (bad.length ? bad.slice(0, 3).map(function (i, j) {
            var c = QC[qw.answers[i]];
            return '<div class="fly" style="animation-delay:' + (0.2 + j * 0.15) + 's;border-radius:16px;border:1.5px solid ' + c + ';background:rgba(12,18,48,.9);padding:14px 16px;display:flex;gap:12px;align-items:flex-start"><span style="flex:none;font-family:Unbounded,sans-serif;font-weight:800;font-size:16px;color:' + c + '">+' + (qw.answers[i] === 'nee' ? '20' : '10') + '%</span><div><p style="margin:0;font-weight:800">' + QS[i].label + '</p><p style="margin:4px 0 0;font-size:14px;line-height:1.5;color:#C3CAEB">' + QS[i].tip + '</p></div></div>';
          }).join('') : '<p class="cText">Je basis staat. Wil je zeker weten dat het in de praktijk ook klopt? Dat test ik met de Security Check.</p>') +
          '<div class="row rise" style="animation-delay:.7s"><button type="button" class="btn" data-go="ct" data-svc="Security Check" style="--sc:#3ECF8E">Volledige scan aanvragen →</button><button type="button" class="ghost" id="qwReset">Opnieuw</button></div>' +
        '</div>';
      bindGo();
      document.getElementById('qwReset').addEventListener('click', function () { qw = { step: 0, answers: {} }; renderShield(); });
    }
  }

              '<p style="margin:0;font-size:13.5px;line-height:1.6;color:#C3CAEB">Een kapper of advocatenkantoor heeft geen IT-afdeling, maar wel klantdata die beschermd moet worden. Geen vage rapporten die in een la verdwijnen — een eerlijke beoordeling en een concreet plan.</p>' +
              '<p style="margin:auto 0 0;font-family:JetBrains Mono,monospace;font-size:12px;color:#9C8CFF">' + PHONE + '</p>' +
            '</div>' +
          '</div></div>' +
        '</div>' +
        '<p class="cText rise" ' + delay(d, 3, 'text-align:center') + '>Microsoft AZ-900 en SC-900 behaald · alleen voor ZZP en MKB tot 50 medewerkers.</p>' +
        '<div class="row rise" ' + delay(d, 4, 'justify-content:center') + '><button type="button" class="ghost" id="flipBtn" style="--sc:#9C8CFF">↻ Draai de pas om</button><button type="button" class="btn" data-go="ct" style="--sc:#DDE3FF">Bel me gerust eerst even →</button></div>' +
      '</div>';

  // --- Contact: verzenden = versleutelen ---
  var LOCK_ICON = '<svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#070B1F" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="6" y="14" width="20" height="14" rx="3"/><path d="M10 14v-4a6 6 0 0 1 12 0"/></svg>';
  function cardContact(id, d) {
    card.innerHTML =
      '<div class="ctGrid">' +
        '<div class="ctInfo">' +
          '<p class="kicker rise" ' + delay(d, 0, '--sc:#FF5C8A') + '>CONTACT</p>' +
          '<h1 class="rise" ' + delay(d, 1) + '>Plan een gesprek.</h1>' +
          '<p class="cText rise" ' + delay(d, 2, 'font-size:17px') + '>Geen sales funnel, geen wachttijden. Gewoon een eerlijk gesprek — ik reageer vandaag nog.</p>' +
          '<div class="ctList rise" ' + delay(d, 3) + '>' +
            '<a href="tel:' + PHONE.replace(/\s/g, '') + '"><span style="color:#FF5C8A">●</span>' + PHONE + '</a>' +
            '<a href="https://wa.me/31637282540"><span style="color:#3ECF8E">●</span>WhatsApp</a>' +
            '<a href="mailto:' + CONTACT_EMAIL + '"><span style="color:#5CE1FF">●</span>' + CONTACT_EMAIL + '</a>' +
          '</div>' +
          '<p class="rise" ' + delay(d, 4, 'margin:12px 0 0;font-size:13px;color:#8E98C8') + '>Je bericht wordt — passend bij wat ik doe — zichtbaar "versleuteld" verstuurd.</p>' +
          '<p class="rise" ' + delay(d, 5, 'margin:4px 0 0;font-size:12px;color:#5A648E') + '>Digitale Defensie · eenmanszaak B. Eltink · Amsterdam · <a href="juridisch/privacy-beleid.html" style="color:#5A648E;text-decoration:underline">Privacybeleid</a> · <a href="juridisch/algemene-voorwaarden.html" style="color:#5A648E;text-decoration:underline">Algemene voorwaarden</a></p>' +
        '</div>' +
        '<div class="ctPanel rise" id="ctPanel" ' + delay(d, 2) + '></div>' +
      '</div>';
    renderContactForm();
  }
  function renderContactForm() {
    var panel = document.getElementById('ctPanel'); if (!panel) return;
    var opts = [['Security Check', '€450'], ['Azure Kostenanalyse', '€500'], ['Training & Phishing-test', '€325'], ['Weet ik nog niet', 'help me kiezen']];
    panel.innerHTML =
      '<form id="ctForm" novalidate style="display:flex;flex-direction:column;gap:14px">' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">' +
          '<label>Naam<input class="inp" name="naam" type="text" autocomplete="name" placeholder="Voornaam Achternaam" required></label>' +
          '<label>E-mailadres<input class="inp" name="email" type="email" autocomplete="email" placeholder="jij@bedrijf.nl" required></label>' +
        '</div>' +
        '<label>Waar gaat het over?<select class="inp" name="dienst">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === state.lastService ? ' selected' : '') + '>' + esc(o[0]) + ' — ' + o[1] + '</option>'; }).join('') + '</select></label>' +
        '<label>Vertel iets over je situatie<textarea class="inp" name="bericht" rows="5" placeholder="Bijvoorbeeld: we zijn met 8 man en ik weet eigenlijk niet of onze mail goed beveiligd is." style="resize:vertical"></textarea></label>' +
        '<p id="ctErr" role="alert" style="margin:0;color:#FF8A9A;font-size:13.5px"></p>' +
        '<div><button type="submit" class="sendBtn">' + LOCK_ICON + 'Versleutel &amp; verstuur</button></div>' +
      '</form>';
    var form = document.getElementById('ctForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = { naam: form.naam.value.trim(), email: form.email.value.trim(), dienst: form.dienst.value, bericht: form.bericht.value.trim() };
      var okMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);
      form.naam.setAttribute('aria-invalid', data.naam ? 'false' : 'true');
      form.email.setAttribute('aria-invalid', okMail ? 'false' : 'true');
      var err = document.getElementById('ctErr');
      if (!data.naam || !okMail) { err.textContent = !data.naam ? 'Vul je naam in.' : 'Vul een geldig e-mailadres in.'; (data.naam ? form.email : form.naam).focus(); return; }
      err.textContent = '';
      encryptAndSend(data);
    });
  }
  function encryptAndSend(data) {
    var panel = document.getElementById('ctPanel');
    var src = data.naam + ' · ' + data.email + ' · ' + data.dienst + ' · ' + (data.bericht || 'Ik wil graag weten hoe veilig mijn bedrijf echt is.');
    panel.innerHTML =
      '<div id="encBox" style="display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:30px">' +
        '<svg width="72" height="72" viewBox="0 0 32 32" fill="none" stroke="#FF5C8A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><g class="shk"><path d="M10 14v-4a6 6 0 0 1 12 0v4"/></g><rect x="6" y="14" width="20" height="14" rx="3" fill="#1A1033"/><circle cx="16" cy="21" r="2" fill="#FF5C8A"/></svg>' +
        '<p id="encLbl" aria-live="polite" style="margin:0;font-size:12.5px;letter-spacing:.16em;font-weight:700;color:#FF5C8A">VERSLEUTELEN…</p>' +
        '<div style="position:relative;width:100%"><div id="cipher" style="width:100%;border-radius:16px;border:1.5px solid #FF5C8A;background:#0A0E28;padding:18px;font-family:JetBrains Mono,monospace;font-size:14px;line-height:1.7;color:#FFB3C8;word-break:break-all;box-shadow:0 0 40px -10px #FF5C8A"></div></div>' +
      '</div>';
    var box = document.getElementById('encBox'), cEl = document.getElementById('cipher'), lbl = document.getElementById('encLbl');
    var G = 'ABCDEF0123456789+/=', n = 0;
    var result = sendMessage(data);
    cEl.textContent = src;
    var iv = setInterval(function () {
      n += 4;
      var out = '';
      for (var i = 0; i < src.length; i++) out += i < n ? G[Math.floor(Math.random() * G.length)] : src[i];
      cEl.textContent = out;
      if (n >= src.length) clearInterval(iv);
    }, 22);
    stopTimers.push(iv);
    stopLater(function () { box.classList.add('locked'); lbl.textContent = 'VERGRENDELD'; }, 1500);
    stopLater(function () { cEl.classList.add('packet'); lbl.textContent = 'VERZONDEN →'; }, 2000);
    stopLater(function () { result.then(function (ok) { showSent(data, ok); }); }, 2900);
  }
  function sendMessage(data) {
    if (FORM_ENDPOINT) {
      return fetch(FORM_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(data) })
        .then(function (r) { return r.ok; }).catch(function () { return false; });
    }
    return Promise.resolve('mailto');
  }
  function showSent(data, ok) {
    var panel = document.getElementById('ctPanel'); if (!panel) return;
    var first = esc(data.naam.split(' ')[0]);
    if (ok === false) {
      panel.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:60px"><h2 class="cTitle" style="font-size:28px">Er ging iets mis.</h2><p class="cText">Mail direct naar <a href="mailto:' + CONTACT_EMAIL + '">' + CONTACT_EMAIL + '</a> of bel ' + PHONE + '.</p><button type="button" class="ghost" id="ctAgain">Probeer opnieuw</button></div>';
      document.getElementById('ctAgain').addEventListener('click', renderContactForm);
      return;
    }
    var mailto = 'mailto:' + CONTACT_EMAIL + '?subject=' + encodeURIComponent('Aanvraag: ' + data.dienst + ' — ' + data.naam) + '&body=' + encodeURIComponent('Naam: ' + data.naam + '\nE-mail: ' + data.email + '\nDienst: ' + data.dienst + '\n\n' + data.bericht);
    panel.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:60px">' +
        '<div style="position:relative;width:120px;height:120px"><div class="okRing" aria-hidden="true"></div>' +
        '<svg class="okChk" width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>' +
        '<h2 class="rise" style="margin:0;font-family:Unbounded,sans-serif;font-weight:800;font-size:28px">' + (ok === 'mailto' ? 'Bijna verstuurd.' : 'Veilig ontvangen.') + '</h2>' +
        '<p class="cText rise" style="font-size:16px;max-width:400px;animation-delay:.1s">' + (ok === 'mailto'
          ? 'Bedankt, ' + first + '. Je bericht staat klaar in je mail-app — druk daar op verzenden en ik reageer vandaag nog.'
          : 'Bedankt, ' + first + '. Ik neem binnen één werkdag contact met je op over je ' + esc(data.dienst) + '.') + '</p>' +
        '<div class="row rise" style="justify-content:center;animation-delay:.2s">' +
          (ok === 'mailto' ? '<a class="sendBtn" style="text-decoration:none" href="' + mailto + '">Open opnieuw in mail →</a>' : '') +
          '<button type="button" class="ghost" id="ctAgain">Nog een bericht</button>' +
        '</div>' +
      '</div>';
    document.getElementById('ctAgain').addEventListener('click', renderContactForm);
    if (ok === 'mailto') window.location.href = mailto;
  }
 
  // ================= EVENTS =================
  unlockBtn.addEventListener('click', unlock);
  document.getElementById('relockBtn').addEventListener('click', relock);
  document.getElementById('prevBtn').addEventListener('click', function () { go((state.idx - 1 + STOPS.length) % STOPS.length); });
  document.getElementById('nextBtn').addEventListener('click', function () { go((state.idx + 1) % STOPS.length); });
  document.getElementById('svcBackBtn').addEventListener('click', function () { leaveServices(); });
  document.addEventListener('keydown', function (e) {
    if (state.phase === 'services') {
      var tg = e.target.tagName;
      if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
      var i = SVC_ORDER.indexOf(state.svc);
      if (e.key === 'Escape') leaveServices();
      if (e.key === 'ArrowRight') selectService(SVC_ORDER[(i + 1) % SVC_ORDER.length]);
      if (e.key === 'ArrowLeft') selectService(SVC_ORDER[(i + SVC_ORDER.length - 1) % SVC_ORDER.length]);
      return;
    }
    if (state.phase !== 'hop') return;
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'ArrowRight') go((state.idx + 1) % STOPS.length);
    if (e.key === 'ArrowLeft') go((state.idx - 1 + STOPS.length) % STOPS.length);
  });
})();
</script>
