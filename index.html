<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ik wil beter beveiligd worden - Digitale Defensie</title>
<meta name="description" content="Ontdek je digitale veiligheid: diensten met vaste prijs en een eerlijk rapport binnen 48 uur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#070B1F;color:#E8ECFF;font-family:'Manrope',system-ui,sans-serif}
a{color:#5CE1FF}a:hover{color:#B5F1FF}
[hidden]{display:none !important}
button{font:inherit}
 
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes stars{from{background-position:0 0}to{background-position:0 -600px}}
@keyframes starsX{from{background-position:0 0}to{background-position:-600px 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes hintBlink{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes glitchA{0%,88%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}89%{transform:translate(-3px,1px);clip-path:inset(12% 0 55% 0)}92%{transform:translate(2px,-1px);clip-path:inset(60% 0 10% 0)}95%{transform:translate(-1px,0);clip-path:inset(35% 0 40% 0)}}
@keyframes glitchB{0%,85%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}86%{transform:translate(3px,-1px);clip-path:inset(68% 0 6% 0)}90%{transform:translate(-2px,1px);clip-path:inset(22% 0 58% 0)}93%{transform:translate(1px,1px);clip-path:inset(46% 0 30% 0)}}
@keyframes jitter{0%,88%,100%{transform:none}89%{transform:skewX(-6deg)}91%{transform:skewX(4deg)}93%{transform:none}}
@keyframes keyTurn{0%{transform:rotate(0)}100%{transform:rotate(90deg)}}
@keyframes shackleOpen{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(4px) rotate(0)}55%{transform:translateY(-34px) rotate(0)}75%{transform:translateY(-34px) rotate(-34deg)}88%{transform:translateY(-34px) rotate(-28deg)}100%{transform:translateY(-34px) rotate(-30deg)}}
@keyframes bodyFlash{0%,40%{fill:#0C1230}55%{fill:#1C3A7A}100%{fill:#0C1230}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2);opacity:.95}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes particle{0%{transform:translate(-50%,-50%);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);opacity:0}}
@keyframes zoomThrough{0%,55%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(9);opacity:0;filter:blur(6px)}}
@keyframes textAway{to{opacity:0;transform:translateY(30px);letter-spacing:.2em}}
@keyframes reveal{from{clip-path:circle(0% at 50% 44%)}to{clip-path:circle(150% at 50% 44%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes tapPulse{0%{transform:translate(-50%,-50%) scale(.72);opacity:.95}70%{opacity:0}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
@keyframes blipIn{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes blipOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(.2)}}
@keyframes blipPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blipRing{0%{transform:translate(-50%,-50%) scale(.5);opacity:.7}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
 
.app{position:relative;min-height:100vh;min-height:100dvh;background:radial-gradient(1100px 700px at 50% 40%,#13205A 0%,#070B1F 62%);overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 140px 220px,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 300px 80px,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 420px 400px,rgba(255,255,255,.3),transparent);background-size:480px 600px;animation:stars 70s linear infinite}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
 
/* ================= SLOT-SCHERM ================= */
.lockLayer{position:absolute;inset:0;display:flex;flex-direction:column}
.topbar{max-width:1240px;width:100%;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:10px;color:#E8ECFF;text-decoration:none;font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px}
.logo:hover{color:#E8ECFF}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 48px;position:relative}
.radar{position:absolute;left:50%;top:44%;width:min(820px,150vw);aspect-ratio:1/1;transform:translate(-50%,-50%);pointer-events:none}
.radar .r{position:absolute;border-radius:50%}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(92,225,255,0) 0deg,rgba(92,225,255,0) 300deg,rgba(92,225,255,.28) 360deg);animation:spin 6s linear infinite}
.ringA{animation:spin 26s linear infinite}
.ringB{animation:spinRev 40s linear infinite}
.blips{position:absolute;inset:0}
.blip{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#FF4D5E;box-shadow:0 0 10px #FF4D5E,0 0 2px #fff;animation:blipIn .4s ease-out both,blipPulse 1.5s ease-in-out .4s infinite}
.blip::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:1.5px solid #FF4D5E;animation:blipRing 1.5s ease-out .4s infinite}
.blip.out{animation:blipOut .35s ease-in both !important}
.blip.out::after{animation:none;opacity:0}
.unlock{background:transparent;border:0;padding:0;margin:0;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:30px;position:relative}
.unlock:focus-visible{outline:3px solid #5CE1FF;outline-offset:12px;border-radius:24px}
.lockwrap{position:relative;animation:float 5s ease-in-out infinite}
.lockSvg{width:230px;height:276px;overflow:visible;filter:drop-shadow(0 0 40px rgba(92,225,255,.35));position:relative;z-index:2}
.unlock:hover .lockSvg{animation:wiggle .6s ease-in-out}
.unlock:hover .lockLabel{text-shadow:0 0 30px rgba(92,225,255,.55)}
.shackle{transform-box:view-box;transform-origin:150px 112px}
.keyhole{transform-box:view-box;transform-origin:100px 168px}
.flowline{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
.glow{animation:breathe 3s ease-in-out infinite}
.tapring{position:absolute;left:50%;top:48%;width:190px;height:190px;border-radius:50%;border:2px solid #5CE1FF;transform:translate(-50%,-50%);opacity:0;pointer-events:none;animation:tapPulse 2.2s ease-out infinite;z-index:1}
.tapring2{animation-delay:1.1s}
.unlock:hover .tapring{animation-play-state:paused;opacity:0}
.ctaText{display:flex;flex-direction:column;align-items:center;gap:18px}
.lockLabel{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,4.6vw,64px);line-height:1.08;letter-spacing:-.02em;text-align:center;max-width:900px;transition:text-shadow .3s ease}
.hint{display:inline-flex;align-items:center;gap:9px;margin:0;font-size:15px;font-weight:600;letter-spacing:.12em;color:#5CE1FF;animation:hintBlink 2.4s ease-in-out infinite;transition:opacity .3s}
.hint svg{width:18px;height:18px;stroke:#5CE1FF;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.glitch{position:relative;display:inline-block;color:#5CE1FF;animation:jitter 3.4s infinite}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:#9C8CFF;animation:glitchA 3.4s infinite}
.glitch::after{color:#FFFFFF;animation:glitchB 4.1s infinite;opacity:.8}
.opening .shackle{animation:shackleOpen 1s cubic-bezier(.5,0,.2,1.3) .25s both}
.opening .keyhole{animation:keyTurn .35s ease-in-out both}
.opening .lockBody{animation:bodyFlash 1s ease-out .3s both}
.opening .lockwrap{animation:zoomThrough 1.9s cubic-bezier(.7,0,.3,1) both}
.opening .lockLabel{animation:textAway .5s ease-in .35s both}
.opening .hint{opacity:0}
.opening .tapring{opacity:0;animation:none}
.opening .unlock{cursor:default}
.burst{position:absolute;left:50%;top:44%;width:240px;height:240px;border-radius:50%;border:2px solid #5CE1FF;pointer-events:none;animation:burst 1.1s cubic-bezier(.2,.7,.3,1) both}
.part{position:absolute;left:50%;top:44%;width:8px;height:8px;border-radius:50%;background:#5CE1FF;box-shadow:0 0 12px currentColor;pointer-events:none;animation:particle 1s cubic-bezier(.1,.7,.3,1) .45s both}
 
/* ================= PLANEET-HOP ================= */
@keyframes streak{from{background-position:0 0}to{background-position:-1200px 0}}
@keyframes pglow{0%,100%{box-shadow:0 0 60px -10px var(--bc)}50%{box-shadow:0 0 110px 0 var(--bc)}}
.hop{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0B1238 0%,#070B1F 70%);animation:reveal 1s cubic-bezier(.7,0,.2,1) both}
.hop .stars{animation:starsX 90s linear infinite}
.streaks{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background-image:repeating-linear-gradient(0deg,transparent 0 37px,rgba(181,241,255,.35) 37px 38px,transparent 38px 91px),repeating-linear-gradient(0deg,transparent 0 63px,rgba(156,140,255,.25) 63px 64px,transparent 64px 140px);background-size:300px 100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.warping .streaks{opacity:1;animation:streak .5s linear infinite}
.hopTop{position:absolute;left:0;right:0;top:0;z-index:6;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(7,11,31,.85),transparent)}
.hopTop .r{display:flex;align-items:center;gap:14px}
.stopNum{font-size:12px;letter-spacing:.14em;font-weight:700;color:#8E98C8}
.lockBtn{cursor:pointer;background:transparent;color:#AEB7E0;border:1px solid #2A3570;border-radius:999px;padding:9px 16px;min-height:44px;font-size:13px}
.lockBtn:hover{color:#E8ECFF;border-color:#5CE1FF}
 
.space{position:absolute;left:0;right:0;top:0;bottom:0}
.orbitLine{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #22306A}
.track{position:absolute;left:24%;top:50%;transition:transform 1.1s cubic-bezier(.7,0,.2,1),left 1.1s cubic-bezier(.7,0,.2,1)}
.stopEl{position:absolute;transform:translate(-50%,-50%) scale(var(--s,0.8));transition:transform 1.1s cubic-bezier(.7,0,.2,1),opacity .8s,filter .8s}
.stopEl.off{opacity:.45;filter:blur(1.5px)}
.planet{--bc:#5CE1FF;position:relative;border-radius:50%;border:2px solid var(--bc);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc) 40%,#0C1230),#0A0F2A 72%);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.planet svg{stroke:var(--bc);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.planet:focus-visible{outline:3px solid var(--bc);outline-offset:6px}
.stopEl.on .planet{animation:pglow 3s ease-in-out infinite}
.ringE{position:absolute;left:50%;top:50%;width:170%;height:38%;transform:translate(-50%,-50%) rotate(-14deg);border-radius:50%;border:2px solid var(--bc);opacity:.45;pointer-events:none}
.pname{position:absolute;left:50%;top:calc(100% + 14px);transform:translateX(-50%);margin:0;white-space:nowrap;font-size:14px;font-weight:700}
.moonLink{position:absolute;height:0;border-top:1.5px dashed rgba(181,241,255,.55);transform-origin:0 0}
 
.card{position:absolute;z-index:5;right:max(24px,calc(50% - 680px));top:76px;bottom:116px;width:min(600px,calc(100% - 48px));overflow-y:auto;background:rgba(7,11,31,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #1F2A60;border-radius:26px;padding:30px;scrollbar-width:thin;scrollbar-color:#2A3570 transparent}
.card:focus{outline:none}
.kicker{margin:0;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--sc,#5CE1FF)}
.cTitle{margin:0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(26px,2.6vw,36px);line-height:1.08}
.cText{margin:0;font-size:15.5px;line-height:1.65;color:#C3CAEB}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{display:inline-block;background:var(--sc,#5CE1FF);color:#070B1F;font-weight:700;padding:14px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{color:#070B1F;transform:translateY(-2px);box-shadow:0 12px 40px -8px var(--sc,#5CE1FF)}
.ghost{cursor:pointer;background:transparent;color:#AEB7E0;border:1px solid #2A3570;border-radius:999px;padding:10px 18px;min-height:44px;transition:color .2s,border-color .2s}
.ghost:hover{color:#E8ECFF;border-color:var(--sc,#5CE1FF)}
.moonBtn{cursor:pointer;background:transparent;color:#B5F1FF;border:1.5px dashed #B5F1FF;border-radius:14px;padding:12px 16px;min-height:48px;font-weight:700;text-align:left}
.moonBtn:hover{background:rgba(181,241,255,.08)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
 
@keyframes navHello{0%,100%{box-shadow:0 18px 50px -24px rgba(92,225,255,.5),0 0 0 0 rgba(92,225,255,0)}50%{box-shadow:0 18px 50px -24px rgba(92,225,255,.5),0 0 0 8px rgba(92,225,255,.18)}}
@keyframes arrowNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.hopNav{position:absolute;left:0;right:0;bottom:22px;z-index:6;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px}
.navbtn{cursor:pointer;width:64px;height:64px;flex:none;border-radius:50%;border:2px solid #3A4A8A;background:rgba(12,18,48,.95);color:#FFFFFF;font-size:24px;font-weight:700;box-shadow:0 12px 30px -14px rgba(92,225,255,.6);transition:border-color .2s,transform .2s,background .2s}
.navbtn:hover{border-color:#5CE1FF;background:#13205A;transform:scale(1.08)}
#nextBtn{background:#5CE1FF;border-color:#5CE1FF;color:#070B1F}
#nextBtn span{display:inline-block;animation:arrowNudge 1.4s ease-in-out infinite}
#nextBtn:hover{background:#B5F1FF}
.navbtn:focus-visible{outline:3px solid #5CE1FF;outline-offset:3px}
.dots{display:flex;gap:4px;overflow-x:auto;max-width:calc(100% - 170px);background:rgba(10,15,42,.94);border:1.5px solid #2A3570;border-radius:22px;padding:6px 8px;scrollbar-width:none;animation:navHello 2.4s ease-in-out 1.2s 3}
.dotbtn{cursor:pointer;background:transparent;border:0;border-radius:16px;padding:8px 14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#AEB7E0;font-size:13.5px;font-weight:700;white-space:nowrap;transition:background .25s,color .25s}
.dotbtn:hover{color:#FFFFFF;background:rgba(255,255,255,.05)}
.dotbtn i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bc);transition:background .3s,transform .3s,box-shadow .3s}
.dotbtn.on{color:#FFFFFF;background:color-mix(in srgb,var(--bc) 16%,transparent)}
.dotbtn.on i{background:var(--bc);transform:scale(1.25);box-shadow:0 0 12px var(--bc)}
.dotbtn:focus-visible{outline:2px solid var(--bc);border-radius:16px}
 
/* Start-kaart: beloftes + keuzes */
.usps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.usps li{border:1px solid #2A3570;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.4;color:#C3CAEB}
.usps b{display:block;font-family:'Unbounded',sans-serif;color:#5CE1FF;font-size:18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:#E8ECFF;background:rgba(12,18,48,.85);border:1.5px solid #2A3570;border-radius:16px;padding:14px 16px;min-height:64px;transition:border-color .2s,transform .2s,background .2s}
.choice:hover{border-color:var(--c);transform:translateX(4px);background:rgba(19,32,90,.9)}
.choice:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.chIc{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center}
.chIc svg{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chSub{font-size:13.5px;color:#AEB7E0}
@media (max-width:480px){.usps{grid-template-columns:1fr}}
 
/* Diensten-planeet met minimaantjes */
.miniOrbit{position:absolute;inset:-22%;border-radius:50%;border:1px dashed rgba(181,241,255,.35);animation:spin 14s linear infinite;pointer-events:none}
.miniOrbit i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;box-shadow:0 0 12px currentColor}
.enterHint{position:absolute;left:50%;top:calc(100% + 40px);transform:translateX(-50%);white-space:nowrap;font-size:11px;letter-spacing:.14em;font-weight:700;color:#B5F1FF;opacity:0;transition:opacity .4s;animation:hintBlink 2.4s infinite}
.stopEl.on .enterHint{opacity:1}
 
/* Duik-animatie de planeet in */
.stopEl{z-index:1}
.stopEl.on{z-index:3}
.hop .hopTop,.hop .card,.hop .hopNav,.hop .orbitLine{transition:opacity .45s ease}
.hop.diving .hopTop,.hop.diving .card,.hop.diving .hopNav,.hop.diving .orbitLine{opacity:0;pointer-events:none}
.hop.diving .stopEl.off{opacity:0}
.hop.diving .enterHint,.hop.diving .pname{opacity:0 !important;transition:opacity .25s}
.hop.diving .stopEl.on{transition:transform 1.15s cubic-bezier(.6,0,.4,1),filter 1.15s}
.hop.diving .stopEl.on .planet{filter:brightness(1.6)}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--ox,50%) var(--oy,50%),rgba(181,241,255,.55),transparent 45%);opacity:0;z-index:7}
.hop.diving .flash{animation:flashIn 1.2s ease-out both}
@keyframes flashIn{0%{opacity:0}55%{opacity:1}100%{opacity:0}}
@keyframes svcIn{from{clip-path:circle(0px at var(--ox) var(--oy))}to{clip-path:circle(160% at var(--ox) var(--oy))}}
@keyframes svcOut{from{clip-path:circle(160% at var(--ox) var(--oy))}to{clip-path:circle(0px at var(--ox) var(--oy))}}
 
/* ================= DIENSTEN-STELSEL (jouw orbit) ================= */
@keyframes popCore{0%{transform:translate(-50%,-50%) scale(.4) rotate(-40deg);opacity:0}70%{transform:translate(-50%,-50%) scale(1.08) rotate(4deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes sPing{0%{transform:translate(-50%,-50%) scale(.9);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
@keyframes coreBreathe{0%,100%{box-shadow:0 0 40px -6px var(--sc)}50%{box-shadow:0 0 80px 0 var(--sc)}}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}}
@keyframes planetIn{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
@keyframes ringIn{from{opacity:0;transform:scale(.3) rotate(-90deg)}to{opacity:1;transform:none}}
.svcLayer{position:absolute;inset:0;z-index:8;overflow-y:auto;background:radial-gradient(1000px 600px at 30% 30%,#13205A 0%,#070B1F 65%);animation:svcIn 1s cubic-bezier(.7,0,.2,1) both}
.svcLayer.leaving{animation:svcOut .85s cubic-bezier(.6,0,.4,1) both}
.svcInner{position:relative;max-width:1240px;margin:0 auto;padding:22px 24px 56px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.svcTop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.crumbs{display:flex;align-items:center;gap:10px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px}
.crumbs span{color:#4A5590}
.crumbs b{color:#5CE1FF}
.oLayout{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.oLeft{flex:1 1 480px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.oHint{margin:0;font-size:13px;letter-spacing:.14em;color:#AEB7E0;font-weight:700}
.oWrap{--sc:#5CE1FF;position:relative;width:min(100%,560px);aspect-ratio:1/1}
.oWrap .r{position:absolute;border-radius:50%;animation:ringIn 1s .35s cubic-bezier(.2,.8,.2,1) both}
.sOrbit{animation:spin 48s linear infinite}
.sCounter{animation:spinRev 48s linear infinite}
.oTrail{position:absolute;inset:12%;animation:spin 9s linear infinite}
.oTrail span{position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--sc);box-shadow:0 0 16px 4px var(--sc);transition:background .5s,box-shadow .5s}
.oWrap:hover .sOrbit,.oWrap:hover .sCounter,.oWrap:focus-within .sOrbit,.oWrap:focus-within .sCounter{animation-play-state:paused}
.osweep{position:absolute;inset:12%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,color-mix(in srgb,var(--sc) 30%,transparent) 360deg);animation:spin 5s linear infinite}
.oHolder{position:absolute;transform:translate(-50%,-50%)}
.oHolder .sCounter{position:relative}
.sPlanet{--pc:#5CE1FF;position:relative;width:92px;height:92px;border-radius:50%;border:2px solid var(--pc);background:#0C1230;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;animation:planetIn .6s cubic-bezier(.2,.8,.2,1.3) both;transition:transform .45s cubic-bezier(.3,1.5,.5,1),background .3s,box-shadow .3s}
.sPlanet svg{width:36px;height:36px;stroke:var(--pc);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sPlanet:hover{transform:scale(1.12);box-shadow:0 0 30px -4px var(--pc)}
.sPlanet:focus-visible{outline:3px solid var(--pc);outline-offset:6px}
.sPlanet.on{transform:scale(1.22);background:color-mix(in srgb,var(--pc) 22%,#0C1230);box-shadow:0 0 50px -2px var(--pc)}
.sPlanet .pring{position:absolute;left:50%;top:50%;width:92px;height:92px;border-radius:50%;border:2px solid var(--pc);animation:sPing 1.8s ease-out infinite;pointer-events:none}
.sPlabel{position:absolute;top:106px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13.5px;font-weight:700;color:#E8ECFF;text-align:center;transition:color .3s}
.sPlanet.on + .sPlabel{color:var(--pc)}
.sCore{--sc:#5CE1FF;position:absolute;left:50%;top:50%;width:180px;height:180px;border-radius:50%;border:2px solid var(--sc);background:radial-gradient(circle,color-mix(in srgb,var(--sc) 20%,#0C1230) 0%,#0A0F2A 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:popCore .7s cubic-bezier(.2,.8,.2,1.2) both,coreBreathe 3s ease-in-out .7s infinite}
.sCore svg{width:54px;height:54px;stroke:var(--sc);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sCore b{font-family:'Unbounded',sans-serif;font-weight:800;font-size:22px;color:#E8ECFF}
.sCore span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#AEB7E0}
.sShock{position:absolute;left:50%;top:50%;width:180px;height:180px;border-radius:50%;border:2px solid var(--sc);animation:shock 1s ease-out both;pointer-events:none}
.oRight{flex:1 1 440px;min-width:0}
.oDetail{display:flex;flex-direction:column;gap:18px}
.oKicker{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--sc)}
.oKicker span{color:#AEB7E0}
.oDetail .svc-headrow h2{margin:0 0 4px;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(24px,2.8vw,36px);letter-spacing:-.01em;line-height:1.08}
.oDesc{margin:0;color:#C3CAEB;font-size:15.5px;line-height:1.65}
 
/* ---------- Dienst-animaties (jouw versies) ---------- */

.svc-bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}

.anim-box{width:min(340px,100%)}
.anim-security{background:#0A0E28;border:1px solid #27316a;border-radius:16px;padding:16px;position:relative;overflow:hidden}
.ap-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.ap-dot{width:7px;height:7px;border-radius:50%;background:#2A3570}
.ap-title{margin-left:8px;font-size:11px;color:#7A84B8;letter-spacing:.06em;text-transform:uppercase}
.ap-rows{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.ap-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.02)}
.ap-avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#3a4a8a,#27316a);flex-shrink:0}
.ap-name{font-size:12.5px;color:#C3CAEB;flex:1}
.ap-badge{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:100px;opacity:0;animation:apBadge 4s ease-in-out infinite}
.ap-badge.ok{background:rgba(62,207,142,.15);color:#3ecf8e}
.ap-badge.warn{background:rgba(255,194,77,.15);color:#FFC24D}
.ap-badge.bad{background:rgba(255,92,138,.18);color:#FF5C8A}
@keyframes apBadge{0%,4%{opacity:0;transform:scale(.7)}14%,88%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
.ap-scan{position:absolute;left:0;right:0;top:-20%;height:30%;background:linear-gradient(180deg,transparent,rgba(92,225,255,.14),transparent);animation:scanDown 4s ease-in-out infinite}
@keyframes scanDown{0%{top:-20%}100%{top:100%}}
.anim-azure{background:#0A0E28;border:1px solid #27316a;border-radius:16px;padding:22px 20px;text-align:center}
.az-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:19px}
.az-before{color:#7A84B8;text-decoration:line-through;text-decoration-color:rgba(255,92,138,.6)}
.az-after{color:#FFC24D}
.az-arrow{width:16px;height:16px;color:#7A84B8;flex-shrink:0}
.az-bars{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:110px;margin-bottom:18px}
.az-bar{width:22px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#FF5C8A,#7A2E45);height:14%;animation:barGrow 2.6s ease-in-out infinite alternate}
.az-bar.az-down{background:linear-gradient(180deg,#FFC24D,#8a5d10)}
@keyframes barGrow{from{height:14%}to{height:var(--h)}}
.az-badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:6px 14px;border-radius:100px;background:rgba(255,194,77,.15);color:#FFC24D}
.anim-training{background:#0A0E28;border:1px solid #27316a;border-radius:16px;padding:16px}
.tr-inbox{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.tr-mail{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,.02);font-size:11.5px;color:#C3CAEB;position:relative}
.tr-dot{width:7px;height:7px;border-radius:50%;background:#3ecf8e;flex-shrink:0}
.tr-dot.bad{background:#FF5C8A}
.tr-subj{flex:1}
.tr-phish{border:1px solid rgba(255,92,138,.4)}
.tr-flag{font-size:9px;font-weight:700;letter-spacing:.04em;color:#FF5C8A;background:rgba(255,92,138,.15);padding:3px 7px;border-radius:100px;opacity:0;animation:flagPulse 3.4s ease-in-out infinite}
@keyframes flagPulse{0%,20%{opacity:0;transform:scale(.8)}35%,78%{opacity:1;transform:scale(1)}92%,100%{opacity:0}}
.tr-stats{display:flex;align-items:center;justify-content:center;gap:14px}
.tr-stat{text-align:center}
.tr-stat b{display:block;font-family:'Unbounded',sans-serif;font-size:22px;color:#FF5C8A}

.tr-stat span{font-size:10px;color:#7A84B8;text-transform:uppercase;letter-spacing:.05em}
.tr-arrow{width:16px;height:16px;color:#7A84B8;flex-shrink:0}
/* ---------- Live tijdlijn ---------- */
@keyframes typeIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes printOut{from{clip-path:inset(0 0 100% 0);transform:translateY(-16px)}to{clip-path:inset(0 0 0 0);transform:none}}
@keyframes ping{0%{transform:translate(-50%,-50%) scale(.8);opacity:.8}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes blink{50%{opacity:0}}
.ptab{cursor:pointer;color:#AEB7E0;background:rgba(12,18,48,.8);border:1.5px solid #2A3570;border-radius:14px;padding:10px 14px;min-height:52px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.ptab b{color:#E8ECFF;font-size:14px}
.ptab small{font-size:11.5px}
.ptab:hover{border-color:#B5F1FF}
.ptab.on{border-color:#B5F1FF;background:rgba(181,241,255,.08)}
.ptab:focus-visible{outline:3px solid #B5F1FF;outline-offset:3px}
.tl{position:relative;height:50px;margin:0 18px}
.tl .base{position:absolute;left:0;right:0;top:50%;height:2px;background:#22306A}
.tl .fill{position:absolute;left:0;top:50%;height:2px;background:#B5F1FF;transition:width .9s cubic-bezier(.6,0,.3,1)}
.tl .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#B5F1FF;box-shadow:0 0 18px 4px rgba(181,241,255,.6);transition:left .9s cubic-bezier(.6,0,.3,1)}
.node{position:absolute;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:2px solid #2A3570;background:#0C1230;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:12px;color:#8E98C8;transition:border-color .4s,background .4s,color .4s}
.node.done{border-color:#B5F1FF;background:#B5F1FF;color:#070B1F}
.node.now{border-color:#B5F1FF;color:#B5F1FF}
.node .pr{position:absolute;left:50%;top:50%;width:32px;height:32px;border-radius:50%;border:2px solid #B5F1FF;animation:ping 1.4s ease-out infinite}
.screen{border-radius:16px;border:1.5px solid #2A3570;background:#0A0E28;overflow:hidden}
.screenHead{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid #1A2350;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8E98C8}
.screenHead i{width:9px;height:9px;border-radius:50%}
.typed{animation:typeIn .8s steps(30) .25s both}
.cursor{display:inline-block;width:8px;height:15px;background:#B5F1FF;vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite}
.report{animation:printOut 1.2s cubic-bezier(.3,0,.2,1) both;background:#F4F6FF;color:#0C1230;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
 
/* ---------- Schild-meter ---------- */
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-100px)}}
@keyframes flyOut{0%{opacity:0;transform:translateX(-120px) scale(.3) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.level{transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.wave{animation:wave 2.4s linear infinite}
.wave2{animation:wave 3.6s linear infinite reverse}
.liquid{transition:fill .8s}
.fly{animation:flyOut .8s cubic-bezier(.2,.8,.2,1) both}
.ans{cursor:pointer;color:#E8ECFF;background:rgba(12,18,48,.85);border:1.5px solid #2A3570;border-radius:16px;padding:14px 16px;min-height:56px;font-weight:700;font-size:15px;flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;transition:border-color .2s,transform .2s,background .2s}
.ans small{font-weight:500;color:#AEB7E0;font-size:12px}
.ans:hover{border-color:var(--ac);transform:translateY(-3px);background:rgba(19,32,90,.9)}
.ans:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
 
/* ---------- ID-badge ---------- */
@keyframes sway{0%,100%{transform:rotateY(-14deg) rotateZ(-2deg)}50%{transform:rotateY(14deg) rotateZ(2deg)}}
@keyframes holo{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes scanY{from{top:-10%}to{top:110%}}
.bStage{perspective:1400px;display:flex;flex-direction:column;align-items:center}
.bStage:hover .swayer{animation-play-state:paused}
.swayer{animation:sway 6s ease-in-out infinite;transform-style:preserve-3d}
.flip{position:relative;width:270px;height:410px;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.25,.4,1)}
.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(170deg,#16205A,#0B1030 60%);border:1.5px solid #3A4A8A;box-shadow:0 30px 70px -30px rgba(156,140,255,.55)}
.back{transform:rotateY(180deg);background:linear-gradient(170deg,#1A1440,#0B1030);border:1.5px solid #9C8CFF;padding:24px 22px;display:flex;flex-direction:column;gap:12px}
.holo{border-radius:9px;padding:6px 9px;font-size:10.5px;font-weight:800;letter-spacing:.05em;color:#070B1F;background:linear-gradient(110deg,#5CE1FF,#9C8CFF,#FF5C8A,#FFC24D,#5CE1FF);background-size:200% 100%;animation:holo 4s linear infinite;transition:transform .25s}
.holo:hover{transform:scale(1.08) rotate(-2deg)}
.scanline{position:absolute;left:0;right:0;height:40px;background:linear-gradient(180deg,transparent,rgba(156,140,255,.18),transparent);animation:scanY 3.5s linear infinite;pointer-events:none}
.photo{margin:14px 18px 0;height:160px;border-radius:14px;background:linear-gradient(160deg,#2A3570,#121A48) center/cover no-repeat;border:1px solid #3A4A8A}
 
/* ---------- Contact (verzenden = versleutelen) ---------- */
@keyframes shackleClose{from{transform:translateY(-5px) rotate(-30deg)}to{transform:none}}
@keyframes packetFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(60vw,-50vh) scale(.2);opacity:0}}
@keyframes okRing{0%{transform:translate(-50%,-50%) scale(.5);opacity:.9}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
.ctBg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(900px 600px at 62% 30%,#2A1440 0%,transparent 62%);opacity:0;transition:opacity .9s}
.hop.wide .ctBg{opacity:1}
.hop.wide .track{left:12%}
.hop.wide .card{width:min(1040px,calc(100% - 48px));background:transparent;border-color:transparent !important;backdrop-filter:none;-webkit-backdrop-filter:none;padding:30px 4px}
.ctGrid{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.ctInfo{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.ctInfo h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(30px,3.4vw,46px);line-height:1.06}
.ctList{display:flex;flex-direction:column;gap:10px;margin-top:8px;font-size:15px}
.ctList a{color:#E8ECFF;text-decoration:none;display:flex;gap:10px;align-items:center}
.ctList a:hover{color:#FFB3C8}
.ctPanel{flex:1.3 1 460px;min-width:0;position:relative;border-radius:24px;border:1.5px solid #3A2A60;background:rgba(12,14,40,.92);padding:28px;min-height:470px;box-shadow:0 40px 100px -40px rgba(255,92,138,.4)}
.ctPanel label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#AEB7E0}
.inp{font:inherit;font-size:15px;font-weight:500;color:#E8ECFF;background:#0A0E28;border:1.5px solid #2A3570;border-radius:12px;padding:12px 14px;min-height:44px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:#FF5C8A;box-shadow:0 0 0 4px rgba(255,92,138,.18)}
.inp[aria-invalid="true"]{border-color:#FF4D5E}
.sendBtn{cursor:pointer;background:#FF5C8A;color:#070B1F;border:0;border-radius:999px;padding:16px 26px;min-height:52px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s}
.sendBtn:hover{transform:translateY(-2px);box-shadow:0 12px 40px -8px #FF5C8A}
.sendBtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.shk{transform-box:view-box;transform-origin:16px 11px;transform:translateY(-5px) rotate(-30deg)}
.locked .shk{animation:shackleClose .45s cubic-bezier(.5,0,.3,1.4) both}
.packet{animation:packetFly .9s cubic-bezier(.6,0,.4,1) both}
.okRing{position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;border:2px solid #3ECF8E;animation:okRing 1.2s ease-out both}
.okChk path{stroke-dasharray:40;animation:draw .6s .3s ease-out both}
.ctPanel .ghost:hover{border-color:#FF5C8A}
 
/* ---------- Mobiel ---------- */

  .hop{overflow-y:auto}

  .navbtn{width:54px;height:54px;font-size:20px}
  .dots{max-width:calc(100% - 136px)}

  .card{margin-bottom:120px}

}

  .sPlanet{width:72px;height:72px}
  .sPlanet svg{width:28px;height:28px}
  .sPlanet .pring{width:72px;height:72px}
  .sPlabel{top:82px;font-size:12px}

/* ---------- Telefoon: extra ---------- */
/* Horizontaal vegen is voor de stops, niet voor 'terug' in de browser. */
html,body{overscroll-behavior-x:none}
.hop{touch-action:pan-y;overscroll-behavior-x:none}
.ctList a{min-height:44px}
.stopEl.hasMoons .pname{top:calc(122% + 16px)}
.stopEl.hasMoons .enterHint{top:calc(122% + 44px)}
@media (max-width:860px){
  .topbar,.hopTop,.svcInner{padding-top:calc(18px + env(safe-area-inset-top))}
  .hopNav{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .card{margin-bottom:calc(120px + env(safe-area-inset-bottom))}
  .svcInner{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
}
@media (max-width:560px){
  /* Dienstenbaan: kleinere planeten en kern, labels mogen afbreken, ruimte boven en onder voor de labels. */
  .oWrap{width:min(80vw,340px);margin:30px auto 48px}
  .sPlanet,.sPlanet .pring{width:58px;height:58px}
  .sPlanet svg{width:24px;height:24px}
  .sPlanet.on{transform:scale(1.15)}
  .sPlabel{top:66px;width:104px;white-space:normal;line-height:1.25;font-size:11.5px}
  .sCore,.sShock{width:112px;height:112px}
  .sCore svg{width:28px;height:28px}
  .sCore b{font-size:13.5px;white-space:nowrap}
  .sCore span{font-size:8px;max-width:90px;text-align:center}
  .oWrap .sOrbit{inset:8% !important}
  /* Navigatie: alleen de actieve stop met naam, zodat alle vijf passen. */
  .dots{max-width:calc(100% - 124px)}
  .dotbtn{padding:6px 9px;gap:6px}
  .dotbtn:not(.on){font-size:0;gap:0;min-width:40px}
  .navbtn{width:50px;height:50px}
}
@media (max-height:500px) and (orientation:landscape){
  .space{height:170px;top:52px}
  .trackScale{transform:scale(.42)}
  .card{margin-top:60px}
  .hopNav{bottom:0}
  .navbtn{width:46px;height:46px;font-size:18px}
  .dotbtn{min-height:46px}
  .lockSvg{width:140px;height:168px}
  .unlock{gap:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ===== Canvas-achtergronden (radar op slot, planeten op het hop-scherm) ===== */
.radarCv{position:absolute;left:50%;top:44%;width:min(820px,150vw);aspect-ratio:1/1;transform:translate(-50%,-50%);pointer-events:none}
.hopCv{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* ===== Merk-embleem i.p.v. planeet (Start) ===== */
.planet.brand{background:radial-gradient(circle at 50% 40%,#122E6E 0%,#0A1636 58%,#070B1F 100%) !important;box-shadow:0 0 0 1px rgba(92,225,255,.3),0 0 70px rgba(92,225,255,.4),inset 0 0 46px rgba(92,225,255,.14)}
.planet.brand .bring{position:absolute;inset:15%;border-radius:50%;border:1px solid rgba(92,225,255,.28);pointer-events:none}
.planet.brand .bemblem{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.planet.brand .bemblem svg{width:52%;height:52%;stroke:#5CE1FF;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 12px rgba(92,225,255,.7))}
.doList{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.doList li{display:flex;gap:12px;align-items:flex-start}
.doList .dIc{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--d) 16%,transparent);border:1px solid color-mix(in srgb,var(--d) 45%,transparent)}
.doList .dIc svg{width:18px;height:18px;stroke:var(--d);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.doList b{display:block;color:#E8ECFF;font-size:15px}
.doList .dtx{display:block;margin-top:2px;font-size:13.5px;line-height:1.5;color:#C6CEF0}
.navGuide{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.navGuide li{display:flex;align-items:center;gap:11px;font-size:14.5px;color:#C6CEF0}
.navGuide li b{color:#E8ECFF;font-weight:700}
.navGuide li i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--d,#5CE1FF);box-shadow:0 0 10px var(--d,#5CE1FF)}
.navCue{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 15px;border-radius:999px;background:rgba(92,225,255,.1);border:1px solid rgba(92,225,255,.32);color:#B5F1FF;font-weight:700;font-size:13.5px}
.navCue svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;animation:navBob 1.6s ease-in-out infinite}
@keyframes navBob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.mcStart svg{width:18px;height:18px;flex:none}
/* ===== Mini-cursus overlay (iframe) ===== */
.mcLayer{position:fixed;inset:0;z-index:120;background:#070B1F;display:flex;flex-direction:column}
.mcFrame{flex:1 1 auto;width:100%;height:100%;border:0;display:block}
.mcClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:rgba(7,13,33,.82);border:1px solid #2A3570;color:#E8ECFF;border-radius:999px;padding:9px 15px;font:700 13.5px 'Manrope',system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.mcClose:hover{border-color:#5CE1FF;color:#B5F1FF}
.mcClose svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<main class="app" id="app">
  <div class="stars" aria-hidden="true"></div>
 
  <!-- ================= SLOT-SCHERM ================= -->
  <section class="lockLayer" id="lockLayer">
    <header class="topbar">
      <a href="/" class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5CE1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>

    <div class="stage">

            <path class="flowline" d="M30 130 H62 V150 H80" fill="none" stroke="#5CE1FF" stroke-width="2" opacity=".7"/>
            <path class="flowline" d="M170 210 H134 V190 H120" fill="none" stroke="#9C8CFF" stroke-width="2" opacity=".7"/>
            <path class="flowline" d="M30 210 H58 V196" fill="none" stroke="#5CE1FF" stroke-width="2" opacity=".5"/>
            <path class="flowline" d="M170 126 H142 V142" fill="none" stroke="#9C8CFF" stroke-width="2" opacity=".5"/>
            <circle cx="80" cy="150" r="3" fill="#5CE1FF"/>
            <circle cx="120" cy="190" r="3" fill="#9C8CFF"/>

        </div>
        <div class="ctaText">
          <span class="lockLabel">Ik wil beter <span class="glitch" data-text="beveiligd">beveiligd</span> worden</span>

            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.5V5a2 2 0 0 1 4 0v4.5"/><path d="M13 9.5V4a2 2 0 0 1 4 0v8"/><path d="M17 9.5a2 2 0 0 1 4 0V15c0 4-3 7-7 7h-1c-3.5 0-5-1.5-7-5l-2-3.5c-.6-1 .3-2.2 1.4-1.8a3 3 0 0 1 1.6 1.3"/></svg>
            KLIK OP HET SLOT OM TE BEGINNEN
          </p>
        </div>
      </button>
    </div>
    <div id="fx" aria-hidden="true"></div>
  </section>
 
  <!-- ================= PLANEET-HOP ================= -->
  <section class="hop" id="hop" hidden aria-label="Digitale Defensie - verken de onderdelen">
    <div class="stars" aria-hidden="true"></div>
    <div class="streaks" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="ctBg" aria-hidden="true"></div>
 
    <div class="hopTop">
      <a href="/" class="logo" style="font-size:15px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5CE1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        Digitale Defensie
      </a>
      <div class="r">
        <span class="stopNum" id="stopNum" aria-live="polite"></span>
        <button type="button" class="lockBtn" id="relockBtn" aria-label="Terug naar het slot">↺<span class="lbLong"> Terug naar het slot</span></button>
      </div>
    </div>
 
    <div class="space" aria-hidden="false">
      <div class="orbitLine" aria-hidden="true"></div>
      <div class="track" id="track"><div class="trackScale" id="trackInner" style="position:relative"></div></div>
    </div>
 
    <div class="card" id="card" tabindex="-1"></div>
 
    <nav class="hopNav" aria-label="Reisroute">
      <button type="button" class="navbtn" id="prevBtn" aria-label="Vorige stop">←</button>
      <div class="dots" id="dots"></div>
      <button type="button" class="navbtn" id="nextBtn" aria-label="Volgende stop"><span aria-hidden="true">→</span></button>

  <!-- ================= DIENSTEN-STELSEL ================= -->
  <section class="svcLayer" id="svcLayer" hidden aria-label="Diensten">
    <div class="stars" aria-hidden="true"></div>
    <div class="svcInner">
      <div class="svcTop">
        <div class="crumbs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5CE1FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Digitale Defensie <span>›</span> <b>Diensten</b></div>
        <button type="button" class="lockBtn" id="svcBackBtn">← Terug naar de route</button>
      </div>
      <div class="oLayout">
        <div class="oLeft">
          <p class="oHint">KIES EEN DIENST IN DE BAAN</p>
          <div class="oWrap" id="oWrap">
            <div class="r" aria-hidden="true" style="inset:0;border:1px solid #1C2860"></div>
            <div class="r" aria-hidden="true" style="inset:12%;border:2px dashed #2A3A80;animation-delay:.45s"></div>
            <div class="r" aria-hidden="true" style="inset:28%;border:1px solid #22306A;animation-delay:.55s"></div>
            <div class="osweep" aria-hidden="true"></div>
            <div class="oTrail" aria-hidden="true"><span></span></div>
            <div id="coreHost" aria-hidden="true"></div>
            <div class="sOrbit" id="orbitRing" style="position:absolute;inset:12%"></div>
          </div>
        </div>
        <div class="oRight" id="oDetail" aria-live="polite"></div>
      </div>
    </div>
  </section>
</main>
 
<template id="mcSrc">
<title>Klik op het Slot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Slot-intro + mini-cursus in de stijl van digitaledefensie.nl: donker navy, cyaan, Unbounded.
   Je klikt op het slot om te beginnen; elk afgerond gewoonte sluit het slot verder. Dark-only, bewust. */
:root{
  --bg:#070B1F;--bg2:#0B1238;--panel:#0C1434;--panel2:#0E1948;--line:#22306A;--line2:#2A3570;
  --cyan:#5CE1FF;--cyan-soft:#B5F1FF;--purple:#9C8CFF;--alarm:#FF4D5E;--ok:#39E6A0;--amber:#FFC24D;
  --ink:#E8ECFF;--ink2:#AEB7E0;--ink3:#8E98C8;--ink4:#5a65a0;
  --disp:'Unbounded',system-ui,sans-serif;--sans:'Manrope',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.08;letter-spacing:-.02em}
p{margin:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cyan);text-decoration:none}
:focus-visible{outline:2.5px solid var(--cyan);outline-offset:3px;border-radius:10px}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes starsmv{from{background-position:0 0}to{background-position:0 -600px}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes hintBlink{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes glitchA{0%,88%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}89%{transform:translate(-3px,1px);clip-path:inset(12% 0 55% 0)}92%{transform:translate(2px,-1px);clip-path:inset(60% 0 10% 0)}95%{transform:translate(-1px,0);clip-path:inset(35% 0 40% 0)}}
@keyframes glitchB{0%,85%,100%{transform:translate(0,0);clip-path:inset(0 0 100% 0)}86%{transform:translate(3px,-1px);clip-path:inset(68% 0 6% 0)}90%{transform:translate(-2px,1px);clip-path:inset(22% 0 58% 0)}93%{transform:translate(1px,1px);clip-path:inset(46% 0 30% 0)}}
@keyframes jitter{0%,88%,100%{transform:none}89%{transform:skewX(-6deg)}91%{transform:skewX(4deg)}93%{transform:none}}
@keyframes shackleOpen{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(4px)}55%{transform:translateY(-34px)}75%{transform:translateY(-34px) rotate(-34deg)}100%{transform:translateY(-34px) rotate(-30deg)}}
@keyframes bodyFlash{0%,40%{fill:#0C1230}55%{fill:#1C3A7A}100%{fill:#0C1230}}
@keyframes zoomThrough{0%,55%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(9);opacity:0;filter:blur(6px)}}
@keyframes textAway{to{opacity:0;transform:translateY(30px);letter-spacing:.2em}}
@keyframes tapPulse{0%{transform:translate(-50%,-50%) scale(.72);opacity:.95}70%{opacity:0}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}
@keyframes reveal{from{clip-path:circle(0% at 50% 42%)}to{clip-path:circle(150% at 50% 42%)}}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes shackleClose{from{transform:translateY(-34px) rotate(-30deg)}to{transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.app{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;
  background:radial-gradient(1100px 700px at 50% 38%,#13205A 0%,#070B1F 62%)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 140px 220px,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 300px 80px,rgba(255,255,255,.4),transparent),radial-gradient(1px 1px at 420px 400px,rgba(255,255,255,.3),transparent);background-size:480px 600px;animation:starsmv 70s linear infinite}

/* ============ SLOT-INTRO ============ */
.lockLayer{position:absolute;inset:0;display:flex;flex-direction:column;z-index:3}
.ltop{max-width:1240px;width:100%;margin:0 auto;padding:22px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;z-index:2}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:16px}
.logo svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 60px;position:relative}
.radar{position:absolute;left:50%;top:42%;width:min(760px,145vw);aspect-ratio:1/1;transform:translate(-50%,-50%);pointer-events:none}
.radar .r{position:absolute;border-radius:50%}
.sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(92,225,255,0) 0deg,rgba(92,225,255,0) 300deg,rgba(92,225,255,.28) 360deg);animation:spin 6s linear infinite}
.ringA{animation:spin 26s linear infinite}.ringB{animation:spinRev 40s linear infinite}
.unlock{background:transparent;border:0;padding:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:28px;position:relative}
.lockwrap{position:relative;animation:float 5s ease-in-out infinite}
.lockSvg{width:210px;height:252px;overflow:visible;filter:drop-shadow(0 0 40px rgba(92,225,255,.35));position:relative;z-index:2}
.unlock:hover .lockSvg{animation:wiggle .6s ease-in-out}
.unlock:hover .lockLabel{text-shadow:0 0 30px rgba(92,225,255,.55)}
.shackle{transform-box:view-box;transform-origin:150px 112px}
.flowline{stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
.glow{animation:breathe 3s ease-in-out infinite}
.tapring{position:absolute;left:50%;top:47%;width:175px;height:175px;border-radius:50%;border:2px solid var(--cyan);transform:translate(-50%,-50%);opacity:0;pointer-events:none;animation:tapPulse 2.2s ease-out infinite;z-index:1}
.tapring2{animation-delay:1.1s}
.unlock:hover .tapring{opacity:0;animation-play-state:paused}
.ctaText{display:flex;flex-direction:column;align-items:center;gap:16px}
.lockLabel{font-family:var(--disp);font-weight:800;font-size:clamp(30px,8vw,50px);line-height:1.08;text-align:center}
.glitch{position:relative;display:inline-block;color:var(--cyan);animation:jitter 3.4s infinite}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--purple);animation:glitchA 3.4s infinite}
.glitch::after{color:#fff;animation:glitchB 4.1s infinite;opacity:.8}
.hint{display:inline-flex;align-items:center;gap:9px;margin:0;font-size:13.5px;font-weight:700;letter-spacing:.1em;color:var(--cyan);animation:hintBlink 2.4s ease-in-out infinite;text-align:center}
.hint svg{width:17px;height:17px;stroke:var(--cyan);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.opening .shackle{animation:shackleOpen 1s cubic-bezier(.5,0,.2,1.3) .25s both}
.opening .lockBody{animation:bodyFlash 1s ease-out .3s both}
.opening .lockwrap{animation:zoomThrough 1.9s cubic-bezier(.7,0,.3,1) both}
.opening .lockLabel{animation:textAway .5s ease-in .35s both}
.opening .hint{opacity:0}.opening .tapring{opacity:0;animation:none}.opening .unlock{cursor:default}

/* ============ CURSUS ============ */
.course{position:absolute;inset:0;overflow-y:auto;z-index:2;animation:reveal 1s cubic-bezier(.7,0,.2,1) both}
.cwrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.chdr{position:sticky;top:0;z-index:10;padding-top:14px;background:linear-gradient(var(--bg) 76%,transparent)}
.chrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.prog{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.proglock{width:30px;height:34px;flex:0 0 auto}
.proglock .shk{transform-box:view-box;transform-origin:16px 11px;transition:transform .5s cubic-bezier(.5,0,.3,1.4)}
.prog .pt{flex:1 1 auto;min-width:0}
.prog .pl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pbar{height:7px;border-radius:20px;background:#1a2550;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(92,225,255,.5)}
.prog .pv{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--cyan)}

.cstage{flex:1 1 auto;padding:14px 0 4px}
.screen{display:none;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.screen.on{display:block}
.card{background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.kick{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:rgba(92,225,255,.1);border:1px solid rgba(92,225,255,.22);padding:5px 11px;border-radius:30px}
h2.big{font-size:24px;font-weight:800;margin-top:14px}
.lead{color:var(--ink2);margin-top:10px;font-size:14.5px}
.lead b{color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;border:1px solid var(--line2);background:#121c48;color:var(--ink);border-radius:14px;padding:15px;font-family:var(--disp);font-weight:700;font-size:15px;transition:transform .12s,box-shadow .15s,border-color .15s;margin-top:18px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.btn:active{transform:scale(.98)}
.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#041225;box-shadow:0 8px 24px rgba(92,225,255,.3)}
.btn.cyan:hover{background:var(--cyan-soft);border-color:var(--cyan-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:10px 15px;font-size:13px;margin-top:0}

.widget{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:rgba(10,16,44,.6);padding:16px;display:flex;flex-direction:column;gap:14px}
.wtip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:14px}
.wtip svg{width:16px;height:16px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* VPN */
.vrow{display:flex;align-items:center;gap:12px}
.toggle{width:62px;height:34px;border-radius:30px;background:#1a2550;position:relative;border:0;padding:0;flex:0 0 auto;transition:background .25s}

      if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
      var i = SVC_ORDER.indexOf(state.svc);
      if (e.key === 'Escape') leaveServices();
      if (e.key === 'ArrowRight') selectService(SVC_ORDER[(i + 1) % SVC_ORDER.length]);
      if (e.key === 'ArrowLeft') selectService(SVC_ORDER[(i + SVC_ORDER.length - 1) % SVC_ORDER.length]);
      return;
    }
    if (state.phase !== 'hop') return;
    var t = e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (e.key === 'ArrowRight') go((state.idx + 1) % STOPS.length);
    if (e.key === 'ArrowLeft') go((state.idx - 1 + STOPS.length) % STOPS.length);
  });
})();
</script>
<script>
/* ===== Digitale Defensie · canvas-achtergronden =====
   Radar op het slot-scherm, planeten-achtergrond op het hop-scherm.
   Tekent alleen wanneer het betreffende scherm zichtbaar is. */
(function(){
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var CY='#5CE1FF',CYS='#B5F1FF',PU='#9C8CFF',RED='#FF4D5E',PINK='#FF5C8A',OK='#3ECF8E';

  function shieldPath(ctx,x,y,s,col,glow){ctx.save();ctx.translate(x,y);ctx.scale(s/24,s/24);ctx.translate(-12,-12);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}ctx.beginPath();ctx.moveTo(12,22);ctx.bezierCurveTo(12,22,20,18,20,12);ctx.lineTo(20,5);ctx.lineTo(12,2);ctx.lineTo(4,5);ctx.lineTo(4,12);ctx.bezierCurveTo(4,18,12,22,12,22);ctx.stroke();ctx.beginPath();ctx.moveTo(9,12);ctx.lineTo(11,14);ctx.lineTo(15,10);ctx.stroke();ctx.restore();}
  function ring(ctx,x,y,r,col,a,lw){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=lw||2;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.restore();}

  function base(cv){
    var o={cv:cv,ctx:cv.getContext('2d'),W:0,H:0,DPR:1,inited:false,dirty:true};
    o.size=function(){var w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return false;o.DPR=Math.min(2,window.devicePixelRatio||1);o.W=w;o.H=h;cv.width=Math.round(w*o.DPR);cv.height=Math.round(h*o.DPR);o.ctx.setTransform(o.DPR,0,0,o.DPR,0,0);return true;};
    o.ensure=function(){if((!o.inited||o.dirty)&&o.size()){o.init();o.inited=true;o.dirty=false;}return o.inited;};
    return o;
  }

  /* ---------- RADAR (zonder kern: het slot is het middelpunt) ---------- */
  function makeRadar(cv){
    var o=base(cv),comp=[],flash=[],a=0,spawnT=0;
    o.init=function(){var R=Math.min(o.W,o.H)*0.46;comp=[];for(var i=0;i<10;i++)comp.push({ang:Math.random()*7,r:R*(0.4+Math.random()*0.55),state:'safe',t:0});flash=[];a=0;spawnT=1;};
    o.step=function(dt){a=(a+dt*0.55)%(Math.PI*2);spawnT-=dt;var cx=o.W/2,cy=o.H/2;
      if(spawnT<=0){spawnT=0.9+Math.random()*1.1;var s=comp.filter(function(c){return c.state==='safe';});if(s.length){var c=s[(Math.random()*s.length)|0];c.state='attacked';c.t=0;}}
      comp.forEach(function(c){c.t+=dt;if(c.state==='attacked'){var d=((c.ang-a)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(d<0.12){c.state='saved';c.t=0;flash.push({x:cx+Math.cos(c.ang)*c.r,y:cy+Math.sin(c.ang)*c.r,r:6,a:1});}}else if(c.state==='saved'&&c.t>2.2)c.state='safe';});
      flash=flash.filter(function(f){f.r+=dt*90;f.a-=dt*1.4;return f.a>0;});};
    o.draw=function(){var ctx=o.ctx,cx=o.W/2,cy=o.H/2,R=Math.min(o.W,o.H)*0.5;ctx.clearRect(0,0,o.W,o.H);
      for(var i=1;i<=3;i++)ring(ctx,cx,cy,R*i/3*0.95,i===2?'#2A3A80':'#1C2860',.6,i===2?2:1);
      var g=ctx.createConicGradient?ctx.createConicGradient(a,cx,cy):null;
      ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R*0.95,a-0.5,a);ctx.closePath();if(g){g.addColorStop(0,'rgba(92,225,255,0)');g.addColorStop(1,'rgba(92,225,255,.26)');ctx.fillStyle=g;}else ctx.fillStyle='rgba(92,225,255,.12)';ctx.fill();ctx.restore();
      ctx.save();ctx.strokeStyle='rgba(92,225,255,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R*0.95,cy+Math.sin(a)*R*0.95);ctx.stroke();ctx.restore();
      comp.forEach(function(c){var x=cx+Math.cos(c.ang)*c.r,y=cy+Math.sin(c.ang)*c.r;
        if(c.state==='attacked'){var p=0.5+0.5*Math.sin(c.t*9);ring(ctx,x,y,8+p*5,RED,.4+.4*p,1.5);ctx.save();ctx.fillStyle=RED;ctx.shadowColor=RED;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.restore();}
        else if(c.state==='saved')shieldPath(ctx,x,y,16,OK,10);
        else{ctx.save();ctx.fillStyle=CY;ctx.shadowColor=CY;ctx.shadowBlur=8;ctx.fillRect(x-3,y-3,6,6);ctx.restore();}});
      flash.forEach(function(f){ring(ctx,f.x,f.y,f.r,OK,f.a,2);});};
    return o;
  }

  /* ---------- PLANETEN-ACHTERGROND ---------- */
  function makePlanets(cv){
    var o=base(cv),COLS=[CY,PU,'#FFC24D',PINK,CYS],ps=[],atk=[],spark=[],spawnT=0;
    o.init=function(){ps=[];var n=Math.max(5,Math.round(o.W*o.H/150000));for(var i=0;i<n;i++)ps.push({x:Math.random()*o.W,y:Math.random()*o.H,r:16+Math.random()*26,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*8,col:COLS[(Math.random()*COLS.length)|0],rot:Math.random()*7,vr:(Math.random()-.5)*.3,ring:Math.random()<.5,state:'safe',t:0});atk=[];spark=[];spawnT=1.2;};
    o.step=function(dt){spawnT-=dt;
      ps.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.t+=dt;if(p.x<-40)p.x=o.W+40;if(p.x>o.W+40)p.x=-40;if(p.y<-40)p.y=o.H+40;if(p.y>o.H+40)p.y=-40;if(p.state==='shield'&&p.t>1.6)p.state='safe';});
      if(spawnT<=0){spawnT=0.7+Math.random()*0.8;var safe=ps.filter(function(p){return p.state==='safe';});if(safe.length){var tgt=safe[(Math.random()*safe.length)|0],e=(Math.random()*4)|0,sx,sy;if(e===0){sx=Math.random()*o.W;sy=-20;}else if(e===1){sx=o.W+20;sy=Math.random()*o.H;}else if(e===2){sx=Math.random()*o.W;sy=o.H+20;}else{sx=-20;sy=Math.random()*o.H;}atk.push({x:sx,y:sy,tgt:tgt,sp:150+Math.random()*120});tgt.state='targeted';tgt.t=0;}}
      atk.forEach(function(aa){var dx=aa.tgt.x-aa.x,dy=aa.tgt.y-aa.y,d=Math.hypot(dx,dy)||1;aa.x+=dx/d*aa.sp*dt;aa.y+=dy/d*aa.sp*dt;if(d<aa.tgt.r+10){aa.dead=true;aa.tgt.state='shield';aa.tgt.t=0;for(var k=0;k<7;k++)spark.push({x:aa.x,y:aa.y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,a:1});}});
      atk=atk.filter(function(aa){return !aa.dead;});
      spark=spark.filter(function(sp){sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.a-=dt*1.8;return sp.a>0;});};
    o.draw=function(){var ctx=o.ctx;ctx.clearRect(0,0,o.W,o.H);
      ps.forEach(function(p){ctx.save();ctx.translate(p.x,p.y);var grd=ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,p.r*0.1,0,0,p.r);grd.addColorStop(0,p.col);grd.addColorStop(.5,'#1a2550');grd.addColorStop(1,'#0A0F2A');ctx.globalAlpha=.55;ctx.fillStyle=grd;ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();ctx.globalAlpha=.9;ctx.strokeStyle=p.col;ctx.lineWidth=1.6;ctx.stroke();if(p.ring){ctx.rotate(-0.3);ctx.globalAlpha=.4;ctx.strokeStyle=p.col;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,p.r*1.7,p.r*0.5,0,0,7);ctx.stroke();}ctx.restore();
        if(p.state==='targeted'){var q=0.5+0.5*Math.sin(p.t*8);ring(ctx,p.x,p.y,p.r+8+q*4,RED,.4+.3*q,1.5);}
        else if(p.state==='shield'){ring(ctx,p.x,p.y,p.r+8,CY,(1-p.t/1.6)*0.9,2);ctx.save();ctx.globalAlpha=(1-p.t/1.6)*0.5;ctx.fillStyle=CY;ctx.beginPath();ctx.arc(p.x,p.y,p.r+6,0,7);ctx.fill();ctx.restore();shieldPath(ctx,p.x,p.y-p.r-16,16,CY,10);}});
      atk.forEach(function(aa){ctx.save();ctx.strokeStyle=RED;ctx.lineWidth=2.4;ctx.shadowColor=RED;ctx.shadowBlur=10;var dx=aa.tgt.x-aa.x,dy=aa.tgt.y-aa.y,d=Math.hypot(dx,dy)||1;ctx.beginPath();ctx.moveTo(aa.x,aa.y);ctx.lineTo(aa.x-dx/d*14,aa.y-dy/d*14);ctx.stroke();ctx.fillStyle=RED;ctx.beginPath();ctx.arc(aa.x,aa.y,2.8,0,7);ctx.fill();ctx.restore();});
      spark.forEach(function(sp){ctx.save();ctx.globalAlpha=sp.a;ctx.fillStyle=CYS;ctx.beginPath();ctx.arc(sp.x,sp.y,2,0,7);ctx.fill();ctx.restore();});};
    return o;
  }

  var radar=makeRadar(document.getElementById('radarCv'));
  var lockLayer=document.getElementById('lockLayer');
  function vis(el){return el && !el.hidden;}
  window.addEventListener('resize',function(){radar.dirty=true;});
  var last=0;
  function loop(t){var dt=Math.min(0.05,(t-last)/1000||0);last=t;
    if(vis(lockLayer)&&radar.ensure()){if(!reduce)radar.step(dt);radar.draw();}
    requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
})();
</script>
</body>
